# Task 3 - Model B with plain SGD, no momentum
# Generated by issue #1. Filename stem must equal run_id.
run_id: model_b_sgd
seed: 42
device: auto

data:
  root: data/
  manifest: data/splits.csv
  input_size: 64
  batch_size: 128
  num_workers: 2
  augment: true
  norm_stats: data/norm_stats.json

model:
  name: model_b
  num_classes: 10
  channels: [32, 64, 128]
  head: gap
  dropout: 0.2
  pretrained: false
  freeze_backbone: false

optimizer:
  # Family-appropriate SGD baseline; momentum is the only change in sgdm.
  name: sgd
  lr: 0.01
  momentum: 0.0
  weight_decay: 0.0

training:
  epochs: 30
  smoke: false
