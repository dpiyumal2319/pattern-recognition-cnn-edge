# Task 5 - EfficientNet-B0 at 224x224, backbone UNFROZEN, batch 128. Pairs with
# efficientnetb0_64_ft (differs only in input_size) and efficientnetb0_224
# (differs only in freeze_backbone and lr). Estimated need for full fine-tuning
# at 224: ~11 GiB of saved activations, within a T4's 16 GB (#21).
# Added by issue #21. Filename stem must equal run_id.
run_id: efficientnetb0_224_ft_b128
seed: 42
device: auto

data:
  root: data/
  manifest: data/splits.csv
  input_size: 224
  batch_size: 128
  num_workers: 2
  augment: true
  norm_stats: data/norm_stats.json

model:
  name: efficientnet_b0
  num_classes: 10
  channels: []
  head: gap
  dropout: 0.2
  pretrained: true
  freeze_backbone: false

optimizer:
  name: adam
  # 1e-4: the fine-tuning rate of the Keras EfficientNet tutorial linked on
  # CNNs.pdf p58. 1e-3 risks overwriting the pretrained ImageNet features.
  lr: 0.0001
  momentum: 0.0
  weight_decay: 0.0

training:
  epochs: 30
  smoke: false
