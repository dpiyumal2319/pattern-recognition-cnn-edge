# Task 5 - EfficientNet-B0 at 224x224, frozen backbone (supplementary
# resolution ablation). Pairs with efficientnetb0_64: the two differ only in
# input_size. 224 is EfficientNet-B0's design resolution (#21).
# Added by issue #21. Filename stem must equal run_id.
run_id: efficientnetb0_224
seed: 42
device: auto

data:
  root: data/
  manifest: data/splits.csv
  input_size: 224
  batch_size: 128
  num_workers: 2
  augment: true
  norm_stats: data/norm_stats.json

model:
  name: efficientnet_b0
  num_classes: 10
  channels: []
  head: gap
  dropout: 0.2
  pretrained: true
  freeze_backbone: true

optimizer:
  name: adam
  lr: 0.001
  momentum: 0.0
  weight_decay: 0.0

training:
  epochs: 30
  smoke: false
