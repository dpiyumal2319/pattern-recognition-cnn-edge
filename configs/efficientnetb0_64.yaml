# Task 5 - EfficientNet-B0 fine-tuned at 64x64
# Generated by issue #1. Filename stem must equal run_id.
run_id: efficientnetb0_64
seed: 42
device: auto

data:
  root: data/
  manifest: data/splits.csv
  input_size: 64
  batch_size: 128
  num_workers: 2
  augment: true
  norm_stats: data/norm_stats.json

model:
  name: efficientnet_b0
  num_classes: 10
  channels: []
  head: gap
  dropout: 0.2
  pretrained: true
  freeze_backbone: true

optimizer:
  name: adam
  lr: 0.001
  momentum: 0.0
  weight_decay: 0.0

training:
  epochs: 30
  smoke: false
