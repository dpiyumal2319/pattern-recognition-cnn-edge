[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-edge"
version = "0.1.0"
description = "EN3150 A03 - resource-constrained CNN for edge image classification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." is explicit so tests/test_smoke.py can `import scripts.run_experiment`.
# pytest happens to insert the repo root anyway under prepend import mode, but
# relying on that is relying on a side effect of tests/ having an __init__.py.
pythonpath = ["src", "."]
addopts = "-q"
